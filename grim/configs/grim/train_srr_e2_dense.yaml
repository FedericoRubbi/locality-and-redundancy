run_name: "srr_e2_dense_tinyimagenet"
model:
  channels: 256
  stem_strides: [2, 2]
  num_blocks: 3
  time_dim: 128
  embed_dim: 1024
  pool: 2
  delta_task: 0.5
  alpha: 0.5
  dropout: 0.0
  tangent_projection: true
  dense_head: true
  dense_embed_dim: 256
training:
  objective: "dense_infonce"
  dense:
    max_locations: 32
  dataset: "tiny_imagenet"
  num_workers: 11
  batch_size: 512
  epochs: 100
  warmup_epochs: 10
  lr: 0.001
  final_lr: 0.0
  weight_decay: 0.0001
  T: 8
  temperature: 0.1
  detach_state: false
  loss_at_zero: false
  use_ema: false
  ema_momentum: 0.996
  use_pcgrad: false
  grad_log_interval: 50
  eval_every: 10
  amp: true
