accelerator:
  mixed_precision: 'no'
experiment_name: ablation-multiplicative_rde
rde:
  gamma: 1.8
  schedule_type: polynomial
  sigma_max: 0.65
training:
  moment_bias: true
  sign_bias: 0.2
  batch_size: 1024
  dataset: cifar10
  embed_dim: 128
  epochs: 30
  lr: 0.005
  num_workers: 2
  temperature: 0.2
wandb:
  entity: null
  project: rde-ablation
